name: Gerar animações das contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Criar pasta dist
        run: mkdir -p dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar Space Shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install gh-space-shooter
          gh-space-shooter ${{ github.repository_owner }} --output dist/gh-space-shooter.gif --strategy random --fps 40

      - name: Gerar Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#4F46E5&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#6366f1,#4338ca
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a5b4fc&color_dots=#161b22,#312e81,#4338ca,#4F46E5,#818cf8

      - name: Instalar dependências do terminal
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install git+https://github.com/x0rzavi/github-readme-terminal.git@main

      - name: Gerar GIF do terminal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIFOS_GENERAL_FPS: 15
          GIFOS_GENERAL_COLOR_SCHEME: dracula
        run: |
          mkdir -p /tmp/terminal && cd /tmp/terminal
          python "$GITHUB_WORKSPACE/terminal.py"
          mv output.gif "$GITHUB_WORKSPACE/dist/terminal.gif"

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
