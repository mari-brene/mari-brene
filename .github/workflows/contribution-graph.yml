name: Gerar animações das contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Criar pasta dist
        run: mkdir -p dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar Space Shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install gh-space-shooter
          python space_shooter.py ${{ github.repository_owner }} --output dist/gh-space-shooter.gif --strategy random --fps 40

      - name: Gerar Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#50fa7b&color_dots=#343746,#6272a4,#bd93f9,#ff79c6,#ff5555
            dist/github-snake-dark.svg?color_snake=#50fa7b&color_dots=#343746,#6272a4,#bd93f9,#ff79c6,#ff5555

      - name: Instalar dependências do terminal
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install git+https://github.com/x0rzavi/github-readme-terminal.git@main

      - name: Gerar GIF do terminal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIFOS_GENERAL_FPS: 15
          GIFOS_GENERAL_COLOR_SCHEME: dracula
        run: |
          mkdir -p /tmp/terminal && cd /tmp/terminal
          python "$GITHUB_WORKSPACE/terminal.py"
          mv output.gif "$GITHUB_WORKSPACE/dist/terminal.gif"

      - name: Atualizar o ano dos commits no README
        run: |
          ANO=$(TZ=America/Sao_Paulo date +%Y)
          sed -i -E "s/commits_year=[0-9]{4}/commits_year=$ANO/" README.md
          if ! git diff --quiet README.md; then
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -am "Atualiza ano dos commits para $ANO"
            git push
          fi

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
